# Copy to kafka-flow.properties (picked up automatically) or pass with --config.

kafka.bootstrap.servers=localhost:9092

# Secured clusters: any Kafka client setting works with the "kafka." prefix.
#kafka.security.protocol=SASL_SSL
#kafka.sasl.mechanism=SCRAM-SHA-512
#kafka.sasl.jaas.config=org.apache.kafka.common.security.scram.ScramLoginModule required username="viewer" password="secret";
#kafka.ssl.truststore.location=/path/to/truststore.jks
#kafka.ssl.truststore.password=changeit

http.port=8080
poll.interval.ms=2000

# Only show some topics / groups (Java regex on the full name).
#topics.include=orders.*|payments.*
#topics.exclude=.*-changelog|.*-repartition
#groups.exclude=connect-.*
