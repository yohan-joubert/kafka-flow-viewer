# Built-in defaults. Override in kafka-flow.properties, with --config <file>, or with --set key=value.

# --- Web UI ---
http.host=0.0.0.0
http.port=8080

# --- Polling ---
# How often the cluster is sampled. Rates are computed between two samples.
poll.interval.ms=2000
# Timeout for each AdminClient call.
admin.timeout.ms=10000
# Exponential smoothing applied to rates (0 = no smoothing, 0.9 = very smooth).
rate.smoothing=0.5

# --- Filters (Java regex, matched against the full name; empty = no filter) ---
topics.internal=false
topics.include=
topics.exclude=
groups.include=
groups.exclude=

# --- Producers ---
# Producers are discovered with AdminClient.describeProducers (Kafka 3.0+ brokers).
# Only idempotent/transactional producers are visible (the default since Kafka 3.0 clients).
producers.enabled=true
# A producer that hasn't written for this long is no longer drawn.
producers.idle.timeout.ms=60000

# --- Sample message ---
# Lets the UI show one random message of a topic. Needs the Read ACL on the topic. It uses its own consumer
# without a group (manual assignment), so it joins no consumer group and commits no offsets.
sample.enabled=true
# Longer values are cut for display.
sample.max.bytes=65536

# --- Schema Registry (decodes Avro sample messages) ---
# Confluent-compatible registry (Confluent Platform/Cloud, Karapace, Redpanda, Apicurio's ccompat API).
# Several URLs are comma separated. Empty = no registry: Avro is shown as hex.
registry.url=
# Every other "registry.*" key goes to the Schema Registry client with the prefix removed, e.g.
#   registry.basic.auth.user.info=key:secret
#   registry.bearer.auth.credentials.source=STATIC_TOKEN / registry.bearer.auth.token=...
#   registry.schema.registry.ssl.truststore.location=/path/to/truststore.jks
registry.http.connect.timeout.ms=5000
registry.http.read.timeout.ms=10000

# --- Kafka connection (everything after "kafka." goes to the AdminClient) ---
kafka.bootstrap.servers=localhost:9092
kafka.client.id=kafka-flow-viewer
