# Built-in defaults. Override in kafka-flow.properties, with --config <file>, or with --set key=value.

# --- Web UI ---
http.host=0.0.0.0
http.port=8080

# --- Polling ---
# How often the cluster is sampled. Rates are computed between two samples.
poll.interval.ms=2000
# Timeout for each AdminClient call.
admin.timeout.ms=10000
# Exponential smoothing applied to rates (0 = no smoothing, 0.9 = very smooth).
rate.smoothing=0.5

# --- Filters (Java regex, matched against the full name; empty = no filter) ---
topics.internal=false
topics.include=
topics.exclude=
groups.include=
groups.exclude=

# --- Producers ---
# Producers are discovered with AdminClient.describeProducers (Kafka 3.0+ brokers).
# Only idempotent/transactional producers are visible (the default since Kafka 3.0 clients).
producers.enabled=true
# A producer that hasn't written for this long is no longer drawn.
producers.idle.timeout.ms=60000

# --- Kafka connection (everything after "kafka." goes to the AdminClient) ---
kafka.bootstrap.servers=localhost:9092
kafka.client.id=kafka-flow-viewer
